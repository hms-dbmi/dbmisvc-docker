# Title: dbmisvc-docker
# Description: Builder for base image to be used for DBMI services
# Author: HMS DBMI Tech Core
# Version: 0.7.3
# Date: 2024-03-21

_SOURCES_:
  - DockerMake.base.yml
  - DockerMake.alpine.yml
  - DockerMake.debian.yml

# NGINX and njs must be compiled for the same NGINX release.  Alpine 3.22 is
# the oldest maintained Alpine target that publishes this current pair.
_GLOBALS_: &globals
  NGINX_VERSION: "1.31.9"
  NGINX_NJS_VERSION: "1.0.2"
  NGINX_PKG_RELEASE: "1"

alpine:
  FROM: "python:{{ PYTHON_VERSION|default('3.15') }}-alpine{{ ALPINE_VERSION|default('3.22') }}"
  build_args:
    << : *globals
    ALPINE_VERSION: "{{ ALPINE_VERSION|default('3.22') }}"
    PYTHON_VERSION: "{{ PYTHON_VERSION|default('3.15') }}"
  requires:
    - base_meta
    - alpine_nginx_install
    - alpine_prips_build
    - alpine_build
    - base_base_build

alpine3.22:
  FROM: "python:{{ PYTHON_VERSION|default('3.15') }}-alpine3.22"
  build_args:
    << : *globals
    ALPINE_VERSION: 3.22
    PYTHON_VERSION: "{{ PYTHON_VERSION|default('3.15') }}"
  requires:
    - base_meta
    - alpine_nginx_install
    - alpine_prips_build
    - alpine_build
    - base_base_build

debian:
  FROM: "python:{{ PYTHON_VERSION|default('3.15') }}-{{ DEBIAN_CODENAME|default('trixie') }}"
  build_args:
    << : *globals
    DEBIAN_CODENAME: "{{ DEBIAN_CODENAME|default('trixie') }}"
    PYTHON_VERSION: "{{ PYTHON_VERSION|default('3.15') }}"
  requires:
    - base_meta
    - debian_nginx_install
    - debian_prips_build
    - debian_build
    - base_base_build

debian13:
  FROM: "python:{{ PYTHON_VERSION|default('3.15') }}-trixie"
  build_args:
    << : *globals
    DEBIAN_CODENAME: trixie
    PYTHON_VERSION: "{{ PYTHON_VERSION|default('3.15') }}"
  requires:
    - base_meta
    - debian_nginx_install
    - debian_prips_build
    - debian_build
    - base_base_build

debian12:
  FROM: "python:{{ PYTHON_VERSION|default('3.15') }}-bookworm"
  build_args:
    << : *globals
    DEBIAN_CODENAME: bookworm
    PYTHON_VERSION: "{{ PYTHON_VERSION|default('3.15') }}"
  requires:
    - base_meta
    - debian_nginx_install
    - debian_prips_build
    - debian_build
    - base_base_build

debian-slim:
  FROM: "python:{{ PYTHON_VERSION|default('3.15') }}-slim-{{ DEBIAN_CODENAME|default('trixie') }}"
  build_args:
    << : *globals
    DEBIAN_CODENAME: "{{ DEBIAN_CODENAME|default('trixie') }}"
    PYTHON_VERSION: "{{ PYTHON_VERSION|default('3.15') }}"
  requires:
    - base_meta
    - debian_nginx_install
    - debian_prips_build
    - debian_build
    - base_base_build

debian13-slim:
  FROM: "python:{{ PYTHON_VERSION|default('3.15') }}-slim-trixie"
  build_args:
    << : *globals
    DEBIAN_CODENAME: trixie
    PYTHON_VERSION: "{{ PYTHON_VERSION|default('3.15') }}"
  requires:
    - base_meta
    - debian_nginx_install
    - debian_prips_build
    - debian_build
    - base_base_build

debian12-slim:
  FROM: "python:{{ PYTHON_VERSION|default('3.15') }}-slim-bookworm"
  build_args:
    << : *globals
    DEBIAN_CODENAME: bookworm
    PYTHON_VERSION: "{{ PYTHON_VERSION|default('3.15') }}"
  requires:
    - base_meta
    - debian_nginx_install
    - debian_prips_build
    - debian_build
    - base_base_build

_ALL_:
 - alpine
 - alpine3.22
 - debian-slim
 - debian13-slim
 - debian12-slim
 - debian
 - debian13
 - debian12
